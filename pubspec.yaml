name: phone_booth
description: A localized skill-sharing marketplace app built with Flutter and Firebase.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.4.0
  url_launcher: ^6.1.12
  image_picker: ^0.8.7
  path_provider: ^2.0.15
  cached_network_image: ^3.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
